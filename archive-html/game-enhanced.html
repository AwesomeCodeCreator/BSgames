<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="game-title">BS Company Games</title>
    <script src="games.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        html, body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }
        nav {
            background-color: #f4c20d;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            list-style: none;
            display: flex;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin-right: 20px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
        }
        .content-box {
            background-color: #fff;
            color: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            width: 80%;
            margin: 20px auto 0 auto;
            text-align: center;
            min-height: calc(100vh - 140px);
            box-sizing: border-box;
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-top: 20px;
        }
        .game-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: left;
        }
        .game-info h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .game-info p {
            margin: 5px 0;
            color: #666;
        }
        .game-container {
            margin: 0 auto;
            position: relative;
            display: inline-block;
            border: 2px solid #f4c20d;
            border-radius: 5px;
            background: #000;
        }

        :fullscreen .game-container, :-webkit-full-screen .game-container, :-moz-full-screen .game-container {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            border-radius: 0 !important;
            background: #000 !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 9999 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        :fullscreen #game-embed > *, :-webkit-full-screen #game-embed > *, :-moz-full-screen #game-embed > * {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
        }

        #game-embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Unity WebGL specific styles */
        .unity-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            background: #231F20;
        }

        .unity-progress-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 20px;
            background: #333;
            border: 1px solid #666;
            border-radius: 3px;
        }

        .unity-progress-bar-fill {
            height: 100%;
            background: #f4c20d;
            border-radius: 2px;
            transition: width 0.3s;
        }

        button {
            background-color: #f4c20d;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background-color: #d1a700;
        }
        .controls {
            margin-bottom: 15px;
        }
        .error-message {
            color: red;
            font-size: 18px;
            margin-top: 50px;
        }
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #666;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #f4c20d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tech-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .tech-flash { background: #dc2626; color: white; }
        .tech-html5 { background: #059669; color: white; }
        .tech-unity { background: #7c3aed; color: white; }
        .tech-external { background: #0891b2; color: white; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html">BS Company Games</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <!-- <li><a href="#" onclick="window.location.href='index.html'; setTimeout(() => toggleSearch(), 100);">Search</a></li> -->
            <!-- <li><a href="games.html">Games</a></li> -->
        </ul>
    </nav>

    <h1 id="main-title">Game Loading...</h1>

    <div class="content-box">
        <div id="game-info" class="game-info" style="display: none;">
            <h3>Game Information</h3>
            <p><strong>Technology:</strong> <span id="game-tech"></span></p>
            <p><strong>Controls:</strong> <span id="game-controls">Use keyboard/mouse as indicated in game</span></p>
            <p id="game-description"></p>
        </div>

        <div class="controls">
            <button onclick="goHome()">← Back to Games</button>
            <button onclick="reloadGame()">Reload Game</button>
            <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>

        <div class="game-container">
            <div id="loading-indicator" class="loading-indicator">
                <div class="spinner"></div>
                <p>Loading game...</p>
            </div>
            <div id="game-embed" style="display: none;"></div>
        </div>

        <div id="error-container" style="display: none;">
            <div class="error-message">
                Game not found! <a href="index.html">Return to home</a>
            </div>
        </div>
    </div>

    <script>
        let currentGame = null;
        let gameInstance = null;

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        function detectGameType(game) {
            // Determine game type based on available properties
            if (game.externalUrl) return 'external';
            if (game.unityData) return 'unity';
            if (game.html5Path) return 'html5';
            if (game.swfFile) return 'flash';
            return 'unknown';
        }

        function loadFlashGame(game, container, loadingIndicator) {
            const embed = document.createElement('ruffle-embed');
            embed.setAttribute('src', game.swfFile);
            embed.style.width = game.width || '800px';
            embed.style.height = game.height || '600px';
            embed.style.display = 'block';

            embed.addEventListener('loadedmetadata', () => {
                loadingIndicator.style.display = 'none';
                container.style.display = 'block';
                console.log('Flash game loaded successfully');
            });

            embed.addEventListener('error', (e) => {
                console.error('Flash game loading error:', e);
                loadingIndicator.innerHTML = '<p style="color: red;">Failed to load game. <button onclick="reloadGame()">Try Again</button></p>';
            });

            container.appendChild(embed);
            window.currentPlayer = embed;
        }

        function loadHTML5Game(game, container, loadingIndicator) {
            const iframe = document.createElement('iframe');
            iframe.src = game.html5Path;
            iframe.style.width = game.width || "100%";
            iframe.style.height = game.height || "600px";
            iframe.style.border = "none";
            iframe.allowFullscreen = true;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('webkitallowfullscreen', 'true');
            iframe.setAttribute('mozallowfullscreen', 'true');

            // Allow various permissions that HTML5 games might need
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');

            iframe.onload = () => {
                loadingIndicator.style.display = 'none';
                container.style.display = 'block';
                console.log('HTML5 game loaded successfully');
            };

            iframe.onerror = () => {
                loadingIndicator.innerHTML = '<p style="color: red;">Failed to load game. <button onclick="reloadGame()">Try Again</button></p>';
            };

            container.appendChild(iframe);
            window.currentPlayer = iframe;
        }

        function loadUnityGame(game, container, loadingIndicator) {
            // Create Unity container structure
            const unityContainer = document.createElement('div');
            unityContainer.className = 'unity-container';
            unityContainer.style.width = game.width || '960px';
            unityContainer.style.height = game.height || '600px';

            const canvas = document.createElement('canvas');
            canvas.id = 'unity-canvas';

            const progressBar = document.createElement('div');
            progressBar.className = 'unity-progress-bar';
            progressBar.innerHTML = '<div class="unity-progress-bar-fill" style="width: 0%"></div>';

            unityContainer.appendChild(canvas);
            unityContainer.appendChild(progressBar);
            container.appendChild(unityContainer);

            // Load Unity loader script
            const script = document.createElement('script');
            script.src = game.unityLoader || 'UnityLoader.js';
            script.onload = () => {
                // Initialize Unity instance
                try {
                    gameInstance = UnityLoader.instantiate("unity-canvas", game.unityData, {
                        onProgress: (gameInstance, progress) => {
                            const fill = progressBar.querySelector('.unity-progress-bar-fill');
                            if (fill) {
                                fill.style.width = (100 * progress) + '%';
                            }
                            if (progress === 1) {
                                progressBar.style.display = 'none';
                                loadingIndicator.style.display = 'none';
                                container.style.display = 'block';
                            }
                        }
                    });
                } catch (e) {
                    console.error('Unity initialization error:', e);
                    loadingIndicator.innerHTML = '<p style="color: red;">Failed to initialize Unity game. <button onclick="reloadGame()">Try Again</button></p>';
                }
            };

            script.onerror = () => {
                loadingIndicator.innerHTML = '<p style="color: red;">Failed to load Unity loader. <button onclick="reloadGame()">Try Again</button></p>';
            };

            document.head.appendChild(script);
            window.currentPlayer = unityContainer;
        }

        function loadExternalGame(game, container, loadingIndicator) {
            const iframe = document.createElement('iframe');
            iframe.src = game.externalUrl;
            iframe.style.width = game.width || "1000px";
            iframe.style.height = game.height || "800px";
            iframe.style.border = "none";
            iframe.allowFullscreen = true;

            iframe.onload = () => {
                loadingIndicator.style.display = 'none';
                container.style.display = 'block';
            };

            iframe.onerror = () => {
                loadingIndicator.innerHTML = '<p style="color: red;">Failed to load external game. <button onclick="reloadGame()">Try Again</button></p>';
            };

            container.appendChild(iframe);
            window.currentPlayer = iframe;
        }

        function loadGame() {
            const gameId = getUrlParameter('id');
            console.log('Game ID from URL:', gameId);

            if (!gameId) {
                console.log('No game ID found in URL');
                showError();
                return;
            }

            currentGame = getGameById(gameId);
            console.log('Game data retrieved:', currentGame);

            if (!currentGame) {
                console.log('Game not found in database for ID:', gameId);
                showError();
                return;
            }

            // Update page title and header
            document.getElementById('game-title').textContent = currentGame.title + ' - BS Company Games';
            document.getElementById('main-title').textContent = currentGame.title;

            // Detect and display game type
            const gameType = detectGameType(currentGame);
            const techBadges = {
                'flash': '<span class="tech-badge tech-flash">Flash/Ruffle</span>',
                'html5': '<span class="tech-badge tech-html5">HTML5</span>',
                'unity': '<span class="tech-badge tech-unity">Unity WebGL</span>',
                'external': '<span class="tech-badge tech-external">External</span>'
            };

            // Update game info
            const gameInfo = document.getElementById('game-info');
            const gameTech = document.getElementById('game-tech');
            const gameDesc = document.getElementById('game-description');
            const gameControls = document.getElementById('game-controls');

            if (currentGame.description || currentGame.controls) {
                gameInfo.style.display = 'block';
                gameTech.innerHTML = techBadges[gameType] || 'Unknown';
                gameDesc.textContent = currentGame.description || '';
                if (currentGame.controls) {
                    gameControls.textContent = currentGame.controls;
                }
            }

            const container = document.getElementById("game-embed");
            const loadingIndicator = document.getElementById("loading-indicator");

            // Load game based on type
            switch(gameType) {
                case 'flash':
                    loadFlashGame(currentGame, container, loadingIndicator);
                    break;
                case 'html5':
                    loadHTML5Game(currentGame, container, loadingIndicator);
                    break;
                case 'unity':
                    loadUnityGame(currentGame, container, loadingIndicator);
                    break;
                case 'external':
                    loadExternalGame(currentGame, container, loadingIndicator);
                    break;
                default:
                    loadingIndicator.innerHTML = '<p style="color: red;">Unknown game type. Cannot load game.</p>';
            }

            console.log(`Loading ${gameType} game:`, currentGame.title);
        }

        function showError() {
            document.getElementById('main-title').textContent = 'Game Not Found';
            document.getElementById('error-container').style.display = 'block';
            document.querySelector('.game-container').style.display = 'none';
        }

        function reloadGame() {
            if (currentGame) {
                const container = document.getElementById("game-embed");
                const loadingIndicator = document.getElementById("loading-indicator");

                // Clear Unity instance if exists
                if (gameInstance) {
                    gameInstance = null;
                }

                // Show loading indicator and clear container
                loadingIndicator.style.display = 'flex';
                loadingIndicator.innerHTML = '<div class="spinner"></div><p>Loading game...</p>';
                container.style.display = 'none';
                container.innerHTML = '';

                // Reload based on game type
                const gameType = detectGameType(currentGame);
                switch(gameType) {
                    case 'flash':
                        loadFlashGame(currentGame, container, loadingIndicator);
                        break;
                    case 'html5':
                        loadHTML5Game(currentGame, container, loadingIndicator);
                        break;
                    case 'unity':
                        loadUnityGame(currentGame, container, loadingIndicator);
                        break;
                    case 'external':
                        loadExternalGame(currentGame, container, loadingIndicator);
                        break;
                }
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function toggleFullscreen() {
            const player = window.currentPlayer;

            if (!document.fullscreenElement && player) {
                player.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', loadGame);

        // Update button text based on fullscreen state
        document.addEventListener('fullscreenchange', () => {
            const button = document.querySelector('button[onclick="toggleFullscreen()"]');
            if (button) {
                button.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
            }
        });
    </script>
</body>
</html>
