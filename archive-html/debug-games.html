<!DOCTYPE html>
<html>
<head>
    <title>Debug Games</title>
    <script src="games.js"></script>
</head>
<body>
    <h1>Debug Games Database</h1>
    <div id="debug-output"></div>

    <script>
        const output = document.getElementById('debug-output');

        // Check if gameDatabase exists
        if (typeof gameDatabase === 'undefined') {
            output.innerHTML = '<p style="color: red;">ERROR: gameDatabase is not defined!</p>';
        } else {
            const gameCount = Object.keys(gameDatabase).length;
            output.innerHTML = `
                <p><strong>Total games found:</strong> ${gameCount}</p>
                <h3>All Game IDs:</h3>
                <ul>
                    ${Object.keys(gameDatabase).map(id => `<li>${id} - ${gameDatabase[id].title}</li>`).join('')}
                </ul>
            `;
        }
    </script>
</body>
</html>
