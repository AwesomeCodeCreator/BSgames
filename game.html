<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="game-title">BS Company Games</title>
    <script src="games.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.4.1"></script>
    <style>
        html, body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }
        nav {
            background-color: #f4c20d;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            list-style: none;
            display: flex;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin-right: 20px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
        }
        .content-box {
            background-color: #fff;
            color: #000;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            width: 80%;
            margin: 20px auto 0 auto;
            text-align: center;
            min-height: calc(100vh - 140px);
            box-sizing: border-box;
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-top: 20px;
        }
        .game-container {
            margin: 0 auto;
            position: relative;
            display: inline-block;
            border: 2px solid #f4c20d;
            border-radius: 5px;
        }

        :fullscreen .game-container, :-webkit-full-screen .game-container, :-moz-full-screen .game-container {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            border-radius: 0 !important;
            background: #000 !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 9999 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        :fullscreen ruffle-player, :-webkit-full-screen ruffle-player, :-moz-full-screen ruffle-player {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
        }
        #game-embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        button {
            background-color: #f4c20d;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background-color: #d1a700;
        }
        .controls {
            margin-bottom: 15px;
        }
        .error-message {
            color: red;
            font-size: 18px;
            margin-top: 50px;
        }
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #666;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #f4c20d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html">BS Company Games</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#" onclick="window.location.href='index.html'; setTimeout(() => toggleSearch(), 100);">Search</a></li>
            <li><a href="test-games.html">Games</a></li>
        </ul>
    </nav>

    <h1 id="main-title">Game Loading...</h1>

    <div class="content-box">
        <div class="controls">
            <button onclick="goHome()">← Back to Games</button>
            <button onclick="reloadGame()">Reload Game</button>
            <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>

        <div class="game-container">
            <div id="loading-indicator" class="loading-indicator">
                <div class="spinner"></div>
                <p>Loading game...</p>
            </div>
            <div id="game-embed" style="display: none;"></div>
        </div>

        <div id="error-container" style="display: none;">
            <div class="error-message">
                Game not found! <a href="index.html">Return to home</a>
            </div>
        </div>
    </div>

    <script>
        let currentGame = null;

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        function getGameById(gameId) {
            // Try exact match first
            if (gameDatabase[gameId]) {
                return gameDatabase[gameId];
            }

            // Try case-insensitive match
            const lowerGameId = gameId.toLowerCase();
            for (const key in gameDatabase) {
                if (key.toLowerCase() === lowerGameId) {
                    return gameDatabase[key];
                }
            }

            return null;
        }

        function loadGame() {
            const gameId = getUrlParameter('id');
            console.log('Game ID from URL:', gameId);

            if (!gameId) {
                console.log('No game ID found in URL');
                showError();
                return;
            }

            currentGame = getGameById(gameId);
            console.log('Game data retrieved:', currentGame);

            if (!currentGame) {
                console.log('Game not found in database for ID:', gameId);
                console.log('Available games:', Object.keys(gameDatabase));
                showError();
                return;
            }

            document.getElementById('game-title').textContent = currentGame.title + ' - BS Company Games';
            document.getElementById('main-title').textContent = currentGame.title;

            // Check if this is a redirect-type game
            if (currentGame.redirect && currentGame.externalUrl) {
                // Redirect immediately to the external URL
                console.log('Redirecting to:', currentGame.externalUrl);
                window.location.href = currentGame.externalUrl;
                return;
            }

            renderGame();
        }

        function renderGame() {
            const container = document.getElementById("game-embed");
            const loadingIndicator = document.getElementById("loading-indicator");
            const type = currentGame.type;

            container.style.display = 'none';
            container.innerHTML = '';
            loadingIndicator.style.display = 'flex';
            loadingIndicator.innerHTML = '<div class="spinner"></div><p>Loading game...</p>';
            if (type === 'external') {
                const iframe = document.createElement('iframe');
                iframe.src = currentGame.externalUrl;
                iframe.title = `${currentGame.title} (external game)`;
                iframe.referrerPolicy = 'no-referrer';
                iframe.allow = 'fullscreen; autoplay; gamepad; pointer-lock';
                iframe.sandbox.add('allow-forms', 'allow-pointer-lock', 'allow-popups', 'allow-popups-to-escape-sandbox', 'allow-same-origin', 'allow-scripts');
                iframe.style.width = `${currentGame.width || 1000}px`;
                iframe.style.height = `${currentGame.height || 800}px`;
                iframe.onload = () => showLoadedGame();
                iframe.onerror = () => showLoadError();
                container.appendChild(iframe);
                window.currentPlayer = iframe;
            } else if (type === 'flash') {
                const embed = document.createElement('ruffle-embed');
                embed.setAttribute('src', currentGame.swfFile);
                embed.style.width = '800px';
                embed.style.height = '600px';
                embed.addEventListener('loadedmetadata', showLoadedGame, { once: true });
                embed.addEventListener('error', showLoadError, { once: true });
                container.appendChild(embed);
                window.currentPlayer = embed;
            } else if (type === 'html5' || type === 'unity') {
                const iframe = document.createElement('iframe');
                iframe.src = currentGame.localPath;
                iframe.title = currentGame.title;
                iframe.allow = 'fullscreen; autoplay; gamepad; pointer-lock';
                iframe.allowFullscreen = true;
                iframe.style.width = `${currentGame.width || 1000}px`;
                iframe.style.height = `${currentGame.height || 800}px`;
                iframe.onload = () => showLoadedGame();
                iframe.onerror = () => showLoadError();
                container.appendChild(iframe);
                window.currentPlayer = iframe;
            } else {
                showLoadError('Unknown game type.');
                return;
            }

            window.gameLoadTimeout = setTimeout(showLoadedGame, 5000);
            console.log('Loading game:', currentGame.title, type);
        }

        function showLoadedGame() {
            clearTimeout(window.gameLoadTimeout);
            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('game-embed').style.display = 'block';
        }

        function showLoadError(message = 'Failed to load game.') {
            clearTimeout(window.gameLoadTimeout);
            const loadingIndicator = document.getElementById('loading-indicator');
            loadingIndicator.innerHTML = `<p class="error-message">${message} <button onclick="reloadGame()">Try Again</button></p>`;
        }

        function showError() {
            document.getElementById('main-title').textContent = 'Game Not Found';
            document.getElementById('error-container').style.display = 'block';
            document.querySelector('.game-container').style.display = 'none';
        }

        function reloadGame() {
            if (currentGame) renderGame();
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function toggleFullscreen() {
            const player = window.currentPlayer;

            if (!document.fullscreenElement && player) {
                player.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Ensure everything is loaded before starting
        window.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, checking for dependencies...');

            // Check if games.js is loaded
            if (typeof gameDatabase === 'undefined') {
                console.warn('games.js not loaded, retrying...');
                setTimeout(() => loadGame(), 500);
                return;
            }

            // For Flash games, wait for Ruffle to be available
            if (window.RufflePlayer) {
                loadGame();
            } else {
                console.log('Waiting for Ruffle to load...');
                let ruffleCheckInterval = setInterval(() => {
                    if (window.RufflePlayer) {
                        clearInterval(ruffleCheckInterval);
                        loadGame();
                    }
                }, 100);

                // Fallback: load anyway after 3 seconds
                setTimeout(() => {
                    clearInterval(ruffleCheckInterval);
                    loadGame();
                }, 3000);
            }
        });

        // Update button text based on fullscreen state
        document.addEventListener('fullscreenchange', () => {
            const button = document.querySelector('button[onclick="toggleFullscreen()"]');
            if (button) {
                button.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
            }
        });
    </script>
</body>
</html>
