<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ported Games - BS Company Games</title>
    <script src="games.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #f4c20d;
            text-align: center;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .game-card {
            background: #222;
            border: 2px solid #f4c20d;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .game-card:hover {
            transform: scale(1.05);
            background: #333;
        }
        .game-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .game-type {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 5px;
        }
        .type-flash { background: #dc2626; }
        .type-html5 { background: #059669; }
        .type-unity { background: #7c3aed; }
        .type-external { background: #0891b2; }
        .stats {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .filter-buttons {
            text-align: center;
            margin: 20px 0;
        }
        button {
            background: #f4c20d;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #d1a700;
        }
        button.active {
            background: #fff;
        }
    </style>
</head>
<body>
    <h1>🎮 Test All Ported Games</h1>

    <div class="stats">
        <h2>Game Statistics</h2>
        <p>Total Games: <span id="total-games">0</span></p>
        <p>Flash Games: <span id="flash-count">0</span> | HTML5 Games: <span id="html5-count">0</span> | Unity Games: <span id="unity-count">0</span> | External: <span id="external-count">0</span></p>
        <p>Newly Ported: <span id="new-count">0</span></p>
    </div>

    <div class="filter-buttons">
        <button onclick="filterGames('all')" class="active">All Games</button>
        <button onclick="filterGames('flash')">Flash/Ruffle</button>
        <button onclick="filterGames('html5')">HTML5</button>
        <button onclick="filterGames('unity')">Unity WebGL</button>
        <button onclick="filterGames('external')">External</button>
        <button onclick="filterGames('new')">Newly Ported</button>
    </div>

    <div id="game-grid" class="game-grid"></div>

    <script>
        let currentFilter = 'all';
        const newlyPorted = [
            '1v1lol', 'amongus', 'appel', 'basketbros', 'breakout', 'burritobison',
            'cookieclicker', 'cubefield', 'digdug', 'fbwg', 'flappybird', 'galaga',
            'gettingoverit', 'impossiblequiz', 'run3', 'shellshockers', 'snake-html5',
            'tetris-html5', 'thereisnogame', 'townscaper', 'underrun', 'uno',
            'slope', 'subwaysurfers', 'deathrun3d'
        ];

        function detectGameType(game) {
            if (game.externalUrl) return 'external';
            if (game.unityData) return 'unity';
            if (game.html5Path) return 'html5';
            if (game.swfFile) return 'flash';
            return 'unknown';
        }

        function renderGames(filter = 'all') {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            let flashCount = 0, html5Count = 0, unityCount = 0, externalCount = 0, newCount = 0;

            Object.keys(gameDatabase).forEach(id => {
                const game = gameDatabase[id];
                const type = detectGameType(game);
                const isNew = newlyPorted.includes(id);

                // Count games by type
                if (type === 'flash') flashCount++;
                else if (type === 'html5') html5Count++;
                else if (type === 'unity') unityCount++;
                else if (type === 'external') externalCount++;
                if (isNew) newCount++;

                // Apply filter
                if (filter !== 'all' && filter !== 'new') {
                    if (type !== filter) return;
                } else if (filter === 'new' && !isNew) {
                    return;
                }

                // Create game card
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => testGame(id);

                const typeClass = `type-${type}`;
                const typeLabel = type.charAt(0).toUpperCase() + type.slice(1);

                card.innerHTML = `
                    <div class="game-title">${game.title}</div>
                    <div style="font-size: 12px; color: #888;">${game.description || 'No description'}</div>
                    <div class="game-type ${typeClass}">${typeLabel}</div>
                    ${isNew ? '<div style="color: #f4c20d; font-size: 10px; margin-top: 5px;">★ NEW</div>' : ''}
                `;

                grid.appendChild(card);
            });

            // Update stats
            document.getElementById('total-games').textContent = Object.keys(gameDatabase).length;
            document.getElementById('flash-count').textContent = flashCount;
            document.getElementById('html5-count').textContent = html5Count;
            document.getElementById('unity-count').textContent = unityCount;
            document.getElementById('external-count').textContent = externalCount;
            document.getElementById('new-count').textContent = newCount;
        }

        function filterGames(filter) {
            currentFilter = filter;

            // Update active button
            document.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderGames(filter);
        }

        function testGame(gameId) {
            // Open game in new tab for testing
            window.open(`game.html?id=${gameId}`, '_blank');
        }

        // Initial render
        renderGames();

        console.log('✅ All games loaded successfully!');
        console.log('Click any game card to test it in a new tab.');
        console.log('Newly ported games are marked with a ★ NEW badge.');
    </script>
</body>
</html>
